<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wayfinder</title>
<script>
try { const t = JSON.parse(localStorage.getItem("e29-theme") || "{}"), m = t.mode || "auto";
  document.documentElement.dataset.accent = t.accent || "lehua";
  document.documentElement.dataset.theme = m === "auto" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : m;
  var F = { clean: ["Plus Jakarta Sans", "Plus Jakarta Sans", "Plus+Jakarta+Sans:wght@400;500;600;700;800"], rounded: ["Nunito", "Nunito", "Nunito:wght@400;500;600;700;800"], modern: ["Outfit", "DM Sans", "Outfit:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700"], editorial: ["Playfair Display", "Source Sans 3", "Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;500;600;700"], classic: ["Fraunces", "Manrope", "Fraunces:opsz,wght@9..144,500;9..144,650&family=Manrope:wght@400;500;600;700;800"] }[t.font || "clean"];
  if (F) { var sys = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'; document.documentElement.style.setProperty("--f-display", '"' + F[0] + '", ' + sys); document.documentElement.style.setProperty("--f-body", '"' + F[1] + '", ' + sys);
    document.write('<link rel="stylesheet" data-font="' + (t.font || "clean") + '" href="https://fonts.googleapis.com/css2?family=' + F[2] + '&display=swap">'); }
} catch (e) { document.documentElement.dataset.theme = "light"; }
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1A2430">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wayfinder">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
</head>
<body>
<header class="top">
  <a class="iconbtn back" id="backBtn" href="#/" aria-label="Back to your trips" title="Back to your trips" hidden>←</a>
  <a class="brand" href="#/" aria-label="Wayfinder, your trips"><span class="brand-logo" aria-hidden="true"></span></a>
  <span class="crumb" id="crumb"></span>
  <span class="grow"></span>
  <span class="layout-seg" id="layoutSeg" role="group" aria-label="Map size" hidden></span>
  <a class="iconbtn help-btn" id="helpBtn" href="#/help" aria-label="How to use Wayfinder" title="How to use Wayfinder">?</a>
  <div class="menu-wrap">
    <button class="iconbtn" id="meBtn" type="button" aria-expanded="false" aria-controls="mePop" aria-label="Account and theme"><span class="avatar" id="meAv">?</span></button>
    <div class="pop" id="mePop" hidden>
      <div class="row between" style="gap:10px"><div style="min-width:0"><b id="meName"></b><div class="hint" id="meEmail"></div></div><button class="btn ghost small" id="profBtn" type="button">Edit profile</button></div>
      <h3>Color</h3>
      <div class="swatches" id="swatches"></div>
      <h3>Font</h3>
      <div class="font-pick" id="fontPick"></div>
      <h3>Mode</h3>
      <div class="seg" id="modeSeg"><button type="button" data-mode="auto">Auto</button><button type="button" data-mode="light">Light</button><button type="button" data-mode="dark">Dark</button></div>
      <h3>Temperature</h3>
      <div class="seg" id="tempSeg"><button type="button" data-temp="F">°F</button><button type="button" data-temp="C">°C</button></div>
      <h3>Map labels</h3>
      <div class="seg" id="labelSeg"><button type="button" data-labels="en">English</button><button type="button" data-labels="both">Both</button><button type="button" data-labels="local">Local</button></div>
      <button class="btn ghost small" id="loyBtn" type="button">🎟 Loyalty numbers</button>
      <button class="btn ghost small" id="accessBtn" type="button" hidden>👥 People &amp; access</button>
      <button class="btn ghost small" id="signOut" type="button">Sign out</button>
    </div>
  </div>
</header>
<main id="app"></main>
<div id="modalRoot"></div>
<script type="module" src="app.js"></script>
</body>
</html>
